default: 
  project_path: !expr Sys.setenv(ENVSETUP_PROJECT_PATH = getwd()); getwd()
  paths:
    environ: !expr if (grepl("/PDEV", Sys.getenv("ENVSETUP_PROJECT_PATH"))) {
      Sys.setenv(ENVSETUP_ENVIRON = "PDEV")} else if (grepl("/PREPROD", Sys.getenv("ENVSETUP_PROJECT_PATH"))) {
     Sys.setenv(ENVSETUP_ENVIRON = "PREPROD")} else if (grepl("/PROD", Sys.getenv("ENVSETUP_PROJECT_PATH"))) {
      Sys.setenv(ENVSETUP_ENVIRON = "PROD")}; Sys.getenv("ENVSETUP_ENVIRON")
    a_in: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data")
    am_in: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data/metadata")
    opath: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'))
    dpspath: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data")
    d_in: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data")
    dm_in: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data/metadata")
    a_out: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data")
    
    cl: !expr file.path(Sys.getenv('ENVSETUP_PROJECT_PATH'), "../../_data")
                   
    compound: "globalcode_development"
    protocol: "jnj-56021927--pcr3002--synthetic"
    dbrelease: "dbr_csr_synthetic"    
    rpteff: "re_jjcs_testing"
efficacy:
  paths:
    project_path: !expr Sys.setenv(ENVSETUP_PROJECT_PATH = Sys.getenv("spacepath", unset = getwd())); 
      Sys.getenv("ENVSETUP_PROJECT_PATH")
    environ: !expr if (grepl("/PDEV", Sys.getenv("ENVSETUP_PROJECT_PATH"))) {
      Sys.setenv(ENVSETUP_ENVIRON = "PDEV")} else if (grepl("/PREPROD", Sys.getenv("ENVSETUP_PROJECT_PATH"))) {
     Sys.setenv(ENVSETUP_ENVIRON = "PREPROD")} else if (grepl("/PROD", Sys.getenv("ENVSETUP_PROJECT_PATH"))) {
      Sys.setenv(ENVSETUP_ENVIRON = "PROD")}; Sys.getenv("ENVSETUP_ENVIRON")
    search: !expr Sys.getenv("ENVSETUP_ENVIRON")
    username: !expr   if (Sys.getenv('ENVSETUP_ENVIRON') == "PDEV") {
      Sys.setenv(ENVSETUP_USERNAME = regmatches(Sys.getenv('ENVSETUP_PROJECT_PATH'), regexec(".*PDEV/(.*?)/pharma.*", Sys.getenv('ENVSETUP_PROJECT_PATH')))[[1]][2])} else {
      Sys.setenv(ENVSETUP_USERNAME = "__NA__")}; Sys.getenv("ENVSETUP_USERNAME")
    topdrv: !expr Sys.setenv(ENVSETUP_TOPDRV = sub(paste0("/", Sys.getenv("ENVSETUP_ENVIRON"), ".*"), "\\1",  Sys.getenv("ENVSETUP_PROJECT_PATH")));
                  Sys.getenv("ENVSETUP_TOPDRV")
    remainder: !expr assign("temp_remainder", sub(".*/pharma/", "",  Sys.getenv("ENVSETUP_PROJECT_PATH")), envir = parent.frame());
                     assign("temp_remainder_split", unlist(strsplit(get("temp_remainder", envir = parent.frame()), "[\\/]")), envir = parent.frame());
                     assign("temp_remainder_split_no_programs", get("temp_remainder_split", envir = parent.frame())[!get("temp_remainder_split", envir = parent.frame()) %in% c("programs", "qc")], envir = parent.frame());
                     assign("temp_compound", get("temp_remainder_split_no_programs", envir = parent.frame())[1], envir = parent.frame());
                     assign("temp_protocol", {if(length(get("temp_remainder_split_no_programs", envir = parent.frame())) > 1) {get("temp_remainder_split_no_programs", envir = parent.frame())[2]} else "__NA__"}, envir = parent.frame());
                     assign("temp_dbrelease", {if(length(get("temp_remainder_split_no_programs", envir = parent.frame())) > 2) {get("temp_remainder_split_no_programs", envir = parent.frame())[3]} else "__NA__"}, envir = parent.frame());
                     assign("temp_rpteff", {if(length(get("temp_remainder_split_no_programs", envir = parent.frame())) > 3) {get("temp_remainder_split_no_programs", envir = parent.frame())[4]} else "__NA__"}, envir = parent.frame());
                     Sys.setenv(ENVSETUP_COMPOUND =  get("temp_compound", envir = parent.frame()));
                     Sys.setenv(ENVSETUP_PROTOCOL = get("temp_protocol", envir = parent.frame()));
                     Sys.setenv(ENVSETUP_DBRELEASE = get("temp_dbrelease", envir = parent.frame()));
                     Sys.setenv(ENVSETUP_RPTEFF = get("temp_rpteff", envir = parent.frame()));
                     paste0(get("temp_remainder_split_no_programs", envir = parent.frame()), collapse = "/")
    compound: !expr Sys.getenv("ENVSETUP_COMPOUND")
    protocol: !expr Sys.getenv("ENVSETUP_PROTOCOL")
    dbrelease: !expr Sys.getenv("ENVSETUP_DBRELEASE")
    rpteff: !expr Sys.getenv("ENVSETUP_RPTEFF")
